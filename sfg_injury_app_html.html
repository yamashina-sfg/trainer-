
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Yu Gothic UI',sans-serif}
:root{
  --teal:#028090;--teal-mid:#02A896;--teal-l:#E8F7F9;
  --navy:#1E3A5F;--white:#fff;--bg:#F4F7FA;
  --border:var(--color-border-tertiary);--text:var(--color-text-primary);
  --sub:var(--color-text-secondary);--hint:var(--color-text-tertiary);
}
.app{background:var(--bg);min-height:600px;font-size:14px}
.hdr{background:var(--navy);padding:12px 14px 8px;position:sticky;top:0;z-index:10}
.hdr-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.logo{color:#fff;font-size:15px;font-weight:700;letter-spacing:.3px}
.logo-sub{color:#9EC8D8;font-size:10px;display:block}
.tab-row{display:flex;gap:4px}
.tab{font-size:11px;padding:4px 10px;border-radius:99px;border:1px solid rgba(255,255,255,0.2);background:none;color:#9EC8D8;cursor:pointer;font-family:inherit}
.tab.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.trainer-bar{font-size:11px;background:rgba(2,168,150,0.2);border-radius:5px;padding:3px 8px;color:#5DCAA5;display:inline-block;margin-top:2px}
.wrap{max-width:480px;margin:0 auto;padding:14px 12px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;margin-right:3px;margin-bottom:3px}
.b-teal{background:rgba(2,128,144,.13);color:var(--teal)}
.b-navy{background:rgba(30,58,95,.1);color:var(--navy)}
.b-gray{background:var(--color-background-secondary);color:var(--sub)}
.b-expert{background:var(--teal);color:#fff}
.b-warn{background:#FEF3C7;color:#92400E}
.b-ok{background:#D1FAE5;color:#065F46}
.card{background:var(--color-background-primary);border:0.5px solid var(--border);border-radius:var(--border-radius-lg);padding:13px 15px;margin-bottom:9px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--teal)}
.card.static{cursor:default}
.card.static:hover{border-color:var(--border)}
.card.hi{background:var(--teal-l);border-color:var(--teal)}
.post-body{font-size:13px;color:var(--text);line-height:1.65;margin:7px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--hint)}
.expert-block{background:var(--teal-l);border:0.5px solid var(--teal);border-radius:var(--border-radius-lg);padding:13px 15px;margin:10px 0}
.expert-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.av{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.av-g{background:var(--color-background-secondary);color:var(--sub)}
.disclaimer{margin-top:8px;padding:7px 10px;background:var(--color-background-primary);border-radius:6px;border:0.5px solid #6EE7B7;font-size:11px;color:#065F46}
.cmt{background:var(--color-background-primary);border:0.5px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:8px}
.filter-bar{display:flex;gap:5px;overflow-x:auto;padding-bottom:7px;margin-bottom:11px;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;font-size:12px;padding:4px 12px;border-radius:99px;border:0.5px solid var(--border);background:var(--color-background-primary);color:var(--sub);cursor:pointer;font-family:inherit}
.chip.on{background:var(--teal-l);color:var(--teal);border-color:var(--teal);font-weight:600}
.btn{border:none;border-radius:var(--border-radius-md);padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn:active{opacity:.8}
.btn-teal{background:var(--teal);color:#fff}
.btn-navy{background:var(--navy);color:#fff}
.btn-block{width:100%;display:block;text-align:center}
.btn-sm{padding:6px 13px;font-size:12px}
.back{background:none;border:none;color:var(--teal);cursor:pointer;font-size:13px;padding:0 0 11px;font-family:inherit;display:flex;align-items:center;gap:3px}
.lbl{font-size:12px;font-weight:600;color:var(--text);display:block;margin-bottom:4px}
.inp,.sel,.ta{width:100%;padding:8px 10px;border:0.5px solid var(--border);border-radius:var(--border-radius-md);font-size:13px;color:var(--text);font-family:inherit;background:var(--color-background-primary)}
.inp:focus,.sel:focus,.ta:focus{outline:none;border-color:var(--teal)}
.ta{min-height:85px;resize:vertical}
.fg{margin-bottom:12px}
.info{background:var(--teal-l);border-left:3px solid var(--teal);border-radius:0;padding:8px 11px;font-size:12px;color:var(--teal);margin-bottom:12px}
.ok-box{background:#D1FAE5;border:0.5px solid #6EE7B7;border-radius:var(--border-radius-md);padding:9px 13px;font-size:13px;color:#065F46;margin-bottom:9px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat-c{background:var(--color-background-primary);border:0.5px solid var(--border);border-radius:var(--border-radius-md);padding:11px;text-align:center}
.stat-n{font-size:22px;font-weight:700;color:var(--navy)}
.stat-l{font-size:11px;color:var(--sub);margin-top:2px}
.sec{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:9px;padding-bottom:5px;border-bottom:2px solid var(--teal-l)}
.empty{text-align:center;padding:30px 0;color:var(--sub);font-size:13px}
</style>

<h2 class="sr-only">SFG スポーツ怪我サポートアプリ — 選手・トレーナー両対応のインタラクティブプロトタイプ</h2>

<div class="app">
  <div class="hdr">
    <div class="hdr-row">
      <div>
        <div class="logo">SFG 怪我サポート<span class="logo-sub">スポーツ怪我相談コミュニティ</span></div>
      </div>
      <div class="tab-row">
        <button class="tab on" id="tab-player" onclick="switchMode('player')">選手</button>
        <button class="tab" id="tab-trainer" onclick="switchMode('trainer')">トレーナー</button>
      </div>
    </div>
    <div class="trainer-bar" id="trainer-bar" style="display:none">田中 健一 先生（田中接骨院・八王子）でログイン中</div>
  </div>

  <div class="wrap">
    <div id="screen"></div>
  </div>
</div>

<script>
const TEAL="#028090",NAVY="#1E3A5F";
const SC={サッカー:"#1D9E75",バスケ:"#028090",野球:"#D85A30",陸上:"#BA7517",テニス:"#D4537E",その他:"#888780"};
const TRAINERS={t1:{name:"田中 健一",clinic:"田中接骨院（八王子）",badge:"柔道整復師"},t2:{name:"佐藤 みか",clinic:"さとう整骨院（町田）",badge:"柔道整復師"}};

let mode="player", view="feed", currentPost=null, filter="すべて";

let posts=[
  {id:"p1",sport:"サッカー",part:"足首",timing:"直後",body:"昨日の練習でスライディングして足首を捻りました。歩けますがかなり腫れています。テーピングだけで大丈夫でしょうか？",user:"匿名",at:Date.now()-7200000,comments:[
    {id:"c1",type:"trainer",tid:"t1",body:"腫れがある場合はまず48時間のRICE処置（安静・冷却・圧迫・挙上）を。歩行可能でも靭帯損傷の可能性があるため、症状が続く場合は必ず受診してください。",at:Date.now()-3600000},
    {id:"c2",type:"player",user:"匿名",body:"自分も去年同じことなりました。冷やし続けたら3日で歩けるようになりましたよ",at:Date.now()-1800000}
  ]},
  {id:"p2",sport:"バスケ",part:"膝",timing:"1週間以内",body:"ジャンプの着地で膝の内側が痛くなりました。曲げると違和感があります。練習を休んだ方がいいですか？",user:"匿名",at:Date.now()-18000000,comments:[
    {id:"c3",type:"trainer",tid:"t2",body:"膝内側の痛みは内側側副靭帯の損傷が疑われます。無理に動かすと悪化します。まず安静にして、痛みが引かなければ早めの受診をお勧めします。",at:Date.now()-10800000},
    {id:"c4",type:"player",user:"匿名",body:"私もバスケで膝やりました。早めに接骨院行った方がいいです",at:Date.now()-3600000}
  ]},
  {id:"p3",sport:"野球",part:"肩",timing:"1ヶ月以内",body:"投球後に肩の奥の方が痛みます。投げる動作のときだけ痛くて、普段は何ともないです。",user:"匿名",at:Date.now()-86400000,comments:[]},
  {id:"p4",sport:"陸上",part:"腰",timing:"それ以上",body:"長距離の練習後から腰の張りが続いています。ストレッチしても改善しません。何か良い対処法はありますか？",user:"匿名",at:Date.now()-172800000,comments:[
    {id:"c5",type:"trainer",tid:"t1",body:"長距離による腰の張りは腸腰筋や多裂筋の疲労が原因のことが多いです。股関節周りのストレッチと体幹トレーニングが効果的ですが、継続するようなら一度診せてください。",at:Date.now()-86400000}
  ]},
];

function ago(ts){const d=(Date.now()-ts)/1000;if(d<60)return"たった今";if(d<3600)return Math.floor(d/60)+"分前";if(d<86400)return Math.floor(d/3600)+"時間前";return Math.floor(d/86400)+"日前";}
function sbadge(s){const c=SC[s]||"#888";return`<span class="badge" style="background:${c}22;color:${c}">${s}</span>`;}
function hasTrainer(p){return p.comments.some(c=>c.type==="trainer");}

function switchMode(m){
  mode=m;
  document.getElementById("tab-player").className="tab"+(m==="player"?" on":"");
  document.getElementById("tab-trainer").className="tab"+(m==="trainer"?" on":"");
  document.getElementById("trainer-bar").style.display=m==="trainer"?"":"none";
  view="feed"; currentPost=null; render();
}

function render(){
  const s=document.getElementById("screen");
  if(mode==="player"){
    if(view==="feed") s.innerHTML=renderFeed();
    else if(view==="detail") s.innerHTML=renderDetail();
    else if(view==="post") s.innerHTML=renderPostForm();
    else if(view==="done") s.innerHTML=renderDone();
  } else {
    if(view==="feed") s.innerHTML=renderDashboard();
    else if(view==="detail") s.innerHTML=renderTrainerDetail();
  }
}

function renderFeed(){
  const FILTERS=["すべて","足首","膝","肩","腰","サッカー","バスケ","野球","陸上"];
  const chips=FILTERS.map(f=>`<button class="chip${f===filter?" on":""}" onclick="setFilter('${f}')">${f}</button>`).join("");
  const list=(filter==="すべて"?posts:posts.filter(p=>p.part===filter||p.sport===filter))
    .map(p=>`
      <div class="card${currentPost===p.id?" hi":""}" onclick="openPost('${p.id}')">
        <div>${sbadge(p.sport)}<span class="badge b-navy">${p.part}</span><span class="badge b-gray">${p.timing}</span>${hasTrainer(p)?'<span class="badge b-teal">専門家回答あり</span>':""}</div>
        <div class="post-body">${p.body}</div>
        <div class="post-foot"><span>${p.user} · ${ago(p.at)}</span><span>コメント ${p.comments.length}件</span></div>
      </div>`).join("");
  return `<button class="btn btn-teal btn-block" style="margin-bottom:13px" onclick="goPost()">+ 怪我を相談する（匿名・無料）</button>
    <div class="filter-bar">${chips}</div>${list||'<div class="empty">該当する投稿がありません</div>'}`;
}

function renderDetail(){
  const p=posts.find(x=>x.id===currentPost);
  if(!p) return "";
  const tc=p.comments.filter(c=>c.type==="trainer");
  const pc=p.comments.filter(c=>c.type==="player");
  const tHtml=tc.map(c=>{
    const tr=TRAINERS[c.tid]||{};
    return`<div class="expert-block">
      <div class="expert-hdr"><div class="av">${(tr.name||"?")[0]}</div><div><div style="font-size:13px;font-weight:700;color:${NAVY}">${tr.name} 先生</div><div style="font-size:11px;color:var(--sub)">${tr.clinic} · ${tr.badge}</div></div><span class="badge b-expert" style="margin-left:auto">専門家</span></div>
      <p style="font-size:13px;color:var(--color-text-primary);line-height:1.7">${c.body}</p>
      <div style="font-size:11px;color:var(--hint);margin-top:5px">${ago(c.at)}</div>
      <div class="disclaimer">※ このアドバイスは医療診断ではありません。症状が続く場合は専門家の受診をお勧めします。</div>
    </div>`;}).join("");
  const pHtml=pc.map(c=>`<div class="cmt"><div style="display:flex;align-items:center;gap:6px;margin-bottom:5px"><div class="av av-g" style="width:26px;height:26px;font-size:11px">?</div><span style="font-size:11px;color:var(--sub)">${c.user} · ${ago(c.at)}</span></div><div style="font-size:13px;color:var(--color-text-primary);line-height:1.6">${c.body}</div></div>`).join("");
  return`<button class="back" onclick="goFeed()">← 一覧に戻る</button>
    <div class="card static">
      <div>${sbadge(p.sport)}<span class="badge b-navy">${p.part}</span><span class="badge b-gray">${p.timing}</span></div>
      <p style="font-size:14px;line-height:1.75;margin:8px 0 7px">${p.body}</p>
      <div style="font-size:11px;color:var(--hint)">${p.user} · ${ago(p.at)}</div>
    </div>
    ${tHtml}${pHtml}
    <div class="card static">
      <div style="font-size:13px;font-weight:700;color:var(--color-text-primary);margin-bottom:7px">体験談・コメントを追加</div>
      <div id="cmt-ok" style="display:none" class="ok-box">コメントを送信しました</div>
      <textarea class="ta" id="cmt-body" placeholder="同じ怪我の経験や情報を共有してください（匿名）" style="min-height:68px"></textarea>
      <button class="btn btn-navy btn-sm" style="margin-top:7px" onclick="submitCmt()">投稿する（匿名）</button>
    </div>`;
}

function renderPostForm(){
  return`<button class="back" onclick="goFeed()">← 戻る</button>
    <div class="card static">
      <div style="font-size:15px;font-weight:700;color:${NAVY};margin-bottom:10px">怪我を相談する</div>
      <div class="info">名前・学校は一切不要です。匿名で投稿できます。</div>
      <div class="fg"><label class="lbl">怪我の部位</label><select class="sel" id="f-part"><option>足首</option><option>膝</option><option>腰</option><option>肩</option><option>肘</option><option>手首</option><option>その他</option></select></div>
      <div class="fg"><label class="lbl">スポーツ種別</label><select class="sel" id="f-sport"><option>サッカー</option><option>バスケ</option><option>野球</option><option>陸上</option><option>テニス</option><option>その他</option></select></div>
      <div class="fg"><label class="lbl">怪我した時期</label><select class="sel" id="f-timing"><option>直後</option><option>1週間以内</option><option>1ヶ月以内</option><option>それ以上</option></select></div>
      <div class="fg"><label class="lbl">怪我の状況（500文字以内）</label><textarea class="ta" id="f-body" placeholder="どんな状況で怪我したか、今の症状などを教えてください" maxlength="500"></textarea></div>
      <button class="btn btn-navy btn-block" onclick="submitPost()">投稿する（匿名・無料）</button>
    </div>`;
}

function renderDone(){
  return`<div style="text-align:center;padding:60px 0">
    <div style="font-size:48px;margin-bottom:12px">✅</div>
    <div style="font-size:18px;font-weight:700;color:${NAVY};margin-bottom:7px">投稿しました！</div>
    <div style="font-size:13px;color:var(--sub);margin-bottom:20px">専門トレーナーから回答が届くまでお待ちください</div>
    <button class="btn btn-teal" onclick="goFeed()">一覧に戻る</button>
  </div>`;
}

function renderDashboard(){
  const ua=posts.filter(p=>!hasTrainer(p));
  const aa=posts.filter(p=>hasTrainer(p));
  const uCards=ua.length?ua.map(p=>`
    <div class="card" onclick="openTrainerPost('${p.id}')">
      <div>${sbadge(p.sport)}<span class="badge b-navy">${p.part}</span><span class="badge b-warn">未回答</span></div>
      <div class="post-body">${p.body}</div>
      <div class="post-foot"><span>${ago(p.at)}</span><span>コメント ${p.comments.length}件</span></div>
    </div>`).join(""):`<div class="empty">未回答の相談はありません</div>`;
  const aCards=aa.length?aa.map(p=>`
    <div class="card" onclick="openTrainerPost('${p.id}')">
      <div>${sbadge(p.sport)}<span class="badge b-navy">${p.part}</span><span class="badge b-ok">回答済み</span></div>
      <div class="post-body">${p.body}</div>
      <div class="post-foot"><span>${ago(p.at)}</span><span>コメント ${p.comments.length}件</span></div>
    </div>`).join(""):`<div class="empty">回答済みの相談はまだありません</div>`;
  return`<div class="stat-grid">
    <div class="stat-c"><div class="stat-n">${posts.length}</div><div class="stat-l">総相談数</div></div>
    <div class="stat-c"><div class="stat-n" style="color:#D85A30">${ua.length}</div><div class="stat-l">未回答</div></div>
    <div class="stat-c"><div class="stat-n" style="color:${TEAL}">${aa.length}</div><div class="stat-l">回答済み</div></div>
  </div>
  <div class="sec">未回答の相談</div>${uCards}
  <div class="sec" style="margin-top:16px">回答済みの相談</div>${aCards}`;
}

function renderTrainerDetail(){
  const p=posts.find(x=>x.id===currentPost);
  if(!p) return "";
  const tc=p.comments.filter(c=>c.type==="trainer");
  const pc=p.comments.filter(c=>c.type==="player");
  const existHtml=[...tc.map(c=>{
    const tr=TRAINERS[c.tid]||{};
    return`<div class="expert-block"><div class="expert-hdr"><div class="av">${(tr.name||"?")[0]}</div><div><div style="font-size:13px;font-weight:700;color:${NAVY}">${tr.name} 先生</div><div style="font-size:11px;color:var(--sub)">${tr.clinic}</div></div></div><p style="font-size:13px;line-height:1.7;color:var(--color-text-primary)">${c.body}</p></div>`;}),
    ...pc.map(c=>`<div class="cmt"><div class="post-foot" style="margin-bottom:5px"><span>${c.user} · ${ago(c.at)}</span></div><div style="font-size:13px;color:var(--color-text-primary)">${c.body}</div></div>`)
  ].join("");
  return`<button class="back" onclick="goDashboard()">← ダッシュボードに戻る</button>
    <div class="card static">
      <div>${sbadge(p.sport)}<span class="badge b-navy">${p.part}</span><span class="badge b-gray">${p.timing}</span></div>
      <p style="font-size:14px;line-height:1.75;margin:8px 0 7px">${p.body}</p>
      <div style="font-size:11px;color:var(--hint)">${ago(p.at)}</div>
    </div>
    ${existHtml}
    <div class="card static">
      <div style="font-size:14px;font-weight:700;color:${NAVY};margin-bottom:9px">専門家として回答する</div>
      <div class="info">選手への丁寧なアドバイスをお願いします。</div>
      <div id="ans-ok" style="display:none" class="ok-box">回答を投稿しました！</div>
      <div class="fg"><textarea class="ta" id="ans-body" placeholder="専門的なアドバイスを入力してください..." style="min-height:110px"></textarea></div>
      <button class="btn btn-teal btn-block" onclick="submitAnswer()">回答を投稿する</button>
    </div>`;
}

function setFilter(f){filter=f;render();}
function goFeed(){view="feed";render();}
function goPost(){view="post";render();}
function goDashboard(){view="feed";render();}

function openPost(id){currentPost=id;view="detail";render();}
function openTrainerPost(id){currentPost=id;view="detail";render();}

function submitPost(){
  const body=document.getElementById("f-body").value.trim();
  if(!body){alert("怪我の状況を入力してください");return;}
  posts.unshift({id:"p"+Date.now(),sport:document.getElementById("f-sport").value,part:document.getElementById("f-part").value,timing:document.getElementById("f-timing").value,body,user:"匿名",at:Date.now(),comments:[]});
  view="done";render();
}

function submitCmt(){
  const body=document.getElementById("cmt-body").value.trim();
  if(!body)return;
  const p=posts.find(x=>x.id===currentPost);
  if(p){p.comments.push({id:"c"+Date.now(),type:"player",user:"匿名",body,at:Date.now()});}
  view="detail";render();
  const ok=document.getElementById("cmt-ok");
  if(ok){ok.style.display="";setTimeout(()=>{if(ok)ok.style.display="none"},3000);}
}

function submitAnswer(){
  const body=document.getElementById("ans-body").value.trim();
  if(!body){alert("回答内容を入力してください");return;}
  const p=posts.find(x=>x.id===currentPost);
  if(p){p.comments.push({id:"c"+Date.now(),type:"trainer",tid:"t1",body,at:Date.now()});}
  view="detail";render();
}

render();
</script>
